name: sweep-reminders

on:
  schedule:
    # 每 5 分钟跑一次（UTC 时间，GitHub 免费版 cron 可能有几分钟延迟，可接受）
    # 注意：scheduled workflow 需在默认分支 master 上；连续失败会被 GitHub 暂停调度
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # 允许手动触发

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        working-directory: reminder-engine
        run: npm install

      - name: Run cloud sweep
        working-directory: reminder-engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_ENABLED: 'true'
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: '465'
          EMAIL_SECURE: 'true'
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node cloud-sweep.js
